<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coffee Quality Challenge</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #FAF5EC;
    color: #4A2E1F;
  }

  header {
    background: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 30px;
    border-bottom: 1px solid #ddd;
  }

  .logo {
    font-weight: bold;
  }

  nav {
    display: flex;
    gap: 20px;
  }

  nav button {
    background: none;
    border: none;
    font-size: 16px;
    cursor: pointer;
    color: #8B8378;
  }

  nav button:hover {
    color: #6B4226;
  }

  main {
    max-width: 900px;
    margin: auto;
    padding: 25px;
  }

  .pagina {
    display: none;
  }

  .ativa {
    display: block;
  }

  .hero {
    background: #F1E7D8;
    border-radius: 12px;
    padding: 30px;
    text-align: center;
    margin-bottom: 20px;
  }

  .cartoes {
    display: flex;
    gap: 15px;
    margin-bottom: 20px;
  }

  .cartao {
    background: white;
    border-radius: 10px;
    padding: 20px;
    text-align: center;
    flex: 1;
  }

  .numero {
    font-size: 25px;
    font-weight: bold;
    color: #3F7D4C;
    margin-top: 10px;
  }

  .principal {
    background: #6B4226;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
  }

  form {
    background: white;
    padding: 20px;
    margin-top: 20px;
    border-radius: 10px;
  }

  label {
    display: block;
    margin-top: 10px;
    margin-bottom: 5px;
  }

  input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 5px;
  }

  table {
    width: 100%;
    background: white;
    border-collapse: collapse;
    margin-top: 20px;
  }

  th, td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
    text-align: left;
  }

  th {
    background: #F1E7D8;
  }

  .nota {
    color: #3F7D4C;
    font-weight: bold;
        }
  </style>
</head>
<body>
  <header>

  <div class="logo">
    Coffee Quality Challenge
  </div>

  <nav>
    <button onclick="mostrar('home')">Home</button>
    <button onclick="mostrar('avaliacoes')">Avaliações</button>
    <button onclick="mostrar('ranking')">Ranking</button>
  </nav>

</header>
<main>

  <section id="home" class="pagina ativa">

    <div class="hero">
      <h1>Campeonato de Avaliação de Café</h1>
      <p>Avalie e descubra os melhores cafés especiais.</p>
    </div>

    <div class="cartoes">

      <div class="cartao">

      <div>Total de Cafés</div>

      <div class="numero" id="total">0</div>

      </div>

      <div class="cartao">

      <div>Maior Nota</div>

      <div class="numero" id="maior">
                        -
      </div>

      </div>

    </div>

    <button class="principal" onclick="mostrar('avaliacoes')">Ver Avaliações</button>

  </section>

  <section id="avaliacoes" class="pagina">

    <h2>Cafés Avaliados</h2>

    <table>

    <tr>
      <th>Café</th>
      <th>Produtor</th>
      <th>Nota</th>
    </tr>

    <tbody id="lista"></tbody>

    </table>

    <form onsubmit="salvar(event)">

    <h3>Nova Avaliação</h3>

    <label>Nome do Café</label>

    <input type="text" id="nome" required>

    <label>Produtor</label>

    <input type="text" id="produtor" required>

    <label>Nota (0 a 10)</label>

    <input type="number" id="nota" min="0" max="10" step="0.1" required>

    <br><br>

    <button class="principal">
      Salvar
    </button>
    </form>
  </section>

  <section id="ranking" class="pagina">

    <h2>Ranking Geral</h2>

    <table>

    <tr>
      <th>Posição</th>
      <th>Café</th>
      <th>Produtor</th>
      <th>Nota</th>
    </tr>

    <tbody id="tabela"></tbody>

    </table>
  </section>

</main>
<script>

  var cafes = [
  {
  nome: "Café Preto",
  produtor: "Pedro",
  nota: 9.4
  },

  {
  nome: "Café Especial",
  produtor: "José",
  nota: 8.6
  },

  {
  nome: "Café Vermelho",
  produtor: "Maria",
  nota: 7.3
  }
];

  function mostrar(id) {

    home.style.display = "none";
    avaliacoes.style.display = "none";
    ranking.style.display = "none";

    if (id == "home") {
      home.style.display = "block";
    }

    if (id == "avaliacoes") {
      avaliacoes.style.display = "block";
    }

    if (id == "ranking") {
      ranking.style.display = "block";
    }
  }
  
  function salvar(event) {

    event.preventDefault();

    var novoCafe = {
      nome: nome.value,
      produtor: produtor.value,
      nota: Number(nota.value)
    };

    cafes.push(novoCafe);

    nome.value = "";
    produtor.value = "";
    nota.value = "";

    atualizar();
  }

  function atualizar() {

    total.innerHTML = cafes.length;
    var maiorNota = 0;

    for (var i = 0; i < cafes.length; i++) {

    if (cafes[i].nota > maiorNota) {
      maiorNota = cafes[i].nota;
    }}

    maior.innerHTML = maiorNota.toFixed(1);
    lista.innerHTML = "";

    for (var i = 0; i < cafes.length; i++) {

      lista.innerHTML +=
      "<tr>" +
      "<td>" + cafes[i].nome + "</td>" +
      "<td>" + cafes[i].produtor + "</td>" +
      "<td class='nota'>" + cafes[i].nota.toFixed(1) + "</td>" +
      "</tr>";
    }

    tabela.innerHTML = "";

    for (var i = 0; i < cafes.length; i++) {

    tabela.innerHTML +=
    "<tr>" +
    "<td>" + (i + 1) + "º</td>" +
    "<td>" + cafes[i].nome + "</td>" +
    "<td>" + cafes[i].produtor + "</td>" +
    "<td class='nota'>" + cafes[i].nota.toFixed(1) + "</td>" +
    "</tr>";
}}

  atualizar();

  </script>
</body>
</html>
