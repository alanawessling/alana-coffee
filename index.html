<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coffee Quality Challenge</title>
</head>
<body>

<header>
  <div class="logo">☕ Coffee Quality Challenge</div>
  <nav>
    <button onclick="mostrarPagina('home')" id="btn-home" class="ativo">Home</button>
    <button onclick="mostrarPagina('avaliacoes')" id="btn-avaliacoes">Avaliações</button>
    <button onclick="mostrarPagina('ranking')" id="btn-ranking">Ranking</button>
  </nav>
</header>

<main>

  <section id="home" class="pagina ativa">
    <div class="hero">
      <h1>Campeonato de Avaliação de Café</h1>
      <p>Avalie e descubra os melhores cafés especiais.</p>
    </div>

    <div class="cartoes">
      <div class="cartao">
        <div>Total de Cafés</div>
        <div class="numero" id="totalCafes">0</div>
      </div>
      <div class="cartao">
        <div>Maior Nota</div>
        <div class="numero" id="maiorNota">-</div>
      </div>
    </div>

    <div style="text-align:center;">
      <button class="principal" onclick="mostrarPagina('avaliacoes')">Ver Avaliações</button>
    </div>
  </section>

  <section id="avaliacoes" class="pagina">
    <h2>Cafés Avaliados</h2>
    <div id="listaCafes"></div>

    <form onsubmit="salvarCafe(event)">
      <h3>Nova Avaliação</h3>
      <label>Nome do Café</label>
      <input type="text" id="inputNome" required>

      <label>Produtor</label>
      <input type="text" id="inputProdutor" required>

      <label>Nota (0 a 10)</label>
      <input type="number" id="inputNota" min="0" max="10" required>

      <button class="principal" style="margin-top:16px;">Salvar</button>
    </form>
  </section>

  <section id="ranking" class="pagina">
    <h2>🏆 Ranking Geral</h2>
    <table>
      <thead>
        <tr><th>Posição</th><th>Café</th><th>Produtor</th><th>Nota</th></tr>
      </thead>
      <tbody id="tabelaRanking"></tbody>
    </table>
  </section>

</main>

<script>

  let cafes = [
    { nome: "Bourbon Amarelo", produtor: "Fazenda Boa Vista", nota: 9.3 },
    { nome: "Arara", produtor: "Sítio das Flores", nota: 8.7 },
    { nome: "Catuaí Vermelho", produtor: "Café do Vale", nota: 8.1 }
  ];

  function mostrarPagina(nome) {
    document.querySelectorAll('.pagina').forEach(p => p.classList.remove('ativa'));
    document.getElementById(nome).classList.add('ativa');

    document.querySelectorAll('nav button').forEach(b => b.classList.remove('ativo'));
    document.getElementById('btn-' + nome).classList.add('ativo');

    atualizarTudo();
  }

  // Salva um novo café a partir do formulário
  function salvarCafe(evento) {
    evento.preventDefault();

    const nome = document.getElementById('inputNome').value;
    const produtor = document.getElementById('inputProdutor').value;
    const nota = parseFloat(document.getElementById('inputNota').value);

    cafes.push({ nome, produtor, nota });

    evento.target.reset();
    atualizarTudo();
  }

  function atualizarTudo() {
    document.getElementById('totalCafes').textContent = cafes.length;
    const maior = cafes.length ? Math.max(...cafes.map(c => c.nota)) : 0;
    document.getElementById('maiorNota').textContent = cafes.length ? maior.toFixed(1) : '-';


    const lista = document.getElementById('listaCafes');
    lista.innerHTML = cafes.map(c => `
      <div class="cafe-item">
        <div>
          <div class="nome">${c.nome}</div>
          <div class="produtor">Produtor: ${c.produtor}</div>
        </div>
        <div class="nota">${c.nota.toFixed(1)}</div>
      </div>
    `).join('');

    const ordenado = [...cafes].sort((a, b) => b.nota - a.nota);
    const tabela = document.getElementById('tabelaRanking');
    tabela.innerHTML = ordenado.map((c, i) => `
      <tr>
        <td>${i + 1}º</td>
        <td>${c.nome}</td>
        <td>${c.produtor}</td>
        <td class="nota">${c.nota.toFixed(1)}</td>
      </tr>
    `).join('');
  }

  atualizarTudo();
</script>

</body>
</html>
